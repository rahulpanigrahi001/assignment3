<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Squid Game UI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">SQUID<span>GAME</span></div>
            <nav>
                <a href="#">About</a>
                <a href="#" class="active">Watch now</a>
                <a href="#">Actors</a>
                <a href="#">Contact</a>
            </nav>
            <div class="menu-icon">☰</div>
        </header>

        <main>
            <section class="hero">
                <div class="content">
                    <h1 class="main-title">SQUID <br> GAME</h1>
                    <p class="meta">Action / Thriller / Drama Series directed by Dong-hyuk Hwang</p>
                    <p class="episodes">Season 1: 9 Episodes</p>
                    
                    <div class="buttons">
                        <button class="btn-play">▶ Play Now</button>
                        <button class="btn-trailer">▷ Watch Trailer</button>
                    </div>
                </div>

                <div class="hero-image">
                    <img src="https://www.pngmart.com/files/21/Squid-Game-Costume-PNG-Clipart.png" alt="Squid Game Guard">
                </div>

                <div class="scroll-indicator">SCROLL <span></span></div>
            </section>

            <section class="gallery">
                <div class="card"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSv6KvfxBWSN0MjhRRrJRCw8NFRMB0CQEOwVg&s" alt="Guards"></div>
                <div class="card"><img src="https://media.sketchfab.com/models/148201371444413d9545409c4714271a/thumbnails/6c5ce533a068475e885b14fc866fd77f/88e2170082f1401f8cbab7bd4b788f83.jpeg" alt="Action"></div>
                <div class="card"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSvxQFZlecC7QHa0sNDPoUhfwO3Zi2mU7HfpA&s" alt="Soldiers"></div>
            </section>
        </main>

        <div class="socials">
            <img src="https://cdn-icons-png.flaticon.com/512/733/733635.png" alt="twitter">
            <img src="https://icons.veryicon.com/png/o/miscellaneous/offerino-icons/instagram-53.png" alt="instagram">
            <img src="https://cdn-icons-png.flaticon.com/512/59/59439.png" alt="facebook">
        </div>
    </div>
</body>
</html>
